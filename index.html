<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전환법인 라운지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --page:#F3F5F7;
  --app:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#20242A;
  --ink2:#626B76;
  --ink3:#A4ACB5;
  --brand:#5BC2E7;
  --brand2:#003CDC;
  --brand-soft:#E8F8FD;
  --spring-green:#3AAD67;
  --spring-yellow:#FED63F;
  --spring-orange:#F39945;
  --soft:#F3F8FB;
  --line:#ECEFF2;
  --shadow:0 8px 24px rgba(24,34,45,.08);
  --shadow2:0 16px 36px rgba(24,34,45,.14);
  --ease:cubic-bezier(.22,.8,.28,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  display:flex;justify-content:center;overflow:hidden;
  background:var(--page);
  color:var(--ink);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  letter-spacing:0;-webkit-font-smoothing:antialiased;
}
button,a,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:8px}
.app{
  width:100%;max-width:460px;height:100dvh;background:var(--app);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  border:1px solid rgba(226,231,236,.85);box-shadow:0 18px 64px rgba(29,45,62,.14);
}
@media(min-width:540px){
  body{padding:24px 0}
  .app{height:calc(100dvh - 48px);border-radius:24px}
}
.appbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);z-index:20;
  transition:box-shadow .24s var(--ease),background .24s var(--ease);
}
.app.scrolled .appbar{box-shadow:0 1px 0 var(--line)}
.brand{margin-right:auto;display:flex;align-items:center;min-width:0}
.brand b{font-size:19px;font-weight:850;white-space:nowrap;letter-spacing:0}
.brand b span{color:var(--brand2)}
.user-chip{
  max-width:118px;height:32px;padding:0 10px;border-radius:999px;background:var(--soft);
  color:var(--ink2);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-chip[hidden]{display:none}
.icon-btn{
  position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
  background:transparent;border:0;color:#252A30;
  transition:transform .16s var(--ease),background .2s,color .2s;
}
.icon-btn:hover{background:var(--soft);color:var(--brand2)}
.icon-btn:active{transform:scale(.92)}
.notice-dot{
  position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--spring-orange);box-shadow:0 0 0 2px var(--surface);display:none;
}
.icon-btn.has-unread .notice-dot{display:block}
.tabs{
  flex:0 0 auto;position:relative;display:flex;gap:24px;margin:0;padding:0 16px;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
}
.tab{position:relative;z-index:2;min-height:48px;padding:15px 0 13px;color:var(--ink2);font-size:14px;font-weight:780}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-ind{position:absolute;left:16px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand2);transition:transform .32s var(--ease),width .32s var(--ease)}
.search-wrap{padding:0 16px 16px;background:rgba(255,255,255,.94)}
.tabs[hidden],.search-wrap[hidden],.scroller[hidden]{display:none}
.search-box{
  display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border:1px solid var(--line);
  border-radius:999px;background:#F7F9FA;color:var(--ink2);
}
.search-box svg{flex:0 0 auto}
.search-box input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
.search-box input::placeholder{color:var(--ink3)}
.unread-filter{
  display:none;margin:0 4px 12px;padding:10px 12px;border-radius:10px;
  background:#20242A;color:#fff;font-size:12px;font-weight:760;align-items:center;gap:8px;
}
.unread-filter.show{display:flex}
.unread-filter button{margin-left:auto;color:#fff;font-size:12px;font-weight:850}
.auth-screen{
  flex:1;display:flex;align-items:center;justify-content:center;padding:22px;background:var(--app);
}
.auth-screen[hidden]{display:none}
.auth-card{width:100%;max-width:380px}
.auth-kicker{margin:0 0 10px;color:var(--brand2);font-size:12px;font-weight:900}
.auth-card h1{margin:0 0 8px;font-size:25px;line-height:1.24;font-weight:880}
.auth-card > p:not(.auth-kicker){margin:0 0 22px;color:var(--ink2);font-size:13px;line-height:1.55}
.auth-field{margin-bottom:12px}
.auth-field label{display:block;margin-bottom:7px;color:var(--ink2);font-size:12px;font-weight:850}
.auth-field input{width:100%;height:48px;border:1px solid var(--line);border-radius:8px;background:#FBFCFD;color:var(--ink);padding:0 13px;outline:0}
.auth-field input::placeholder{color:var(--ink3)}
.password-box{position:relative}
.password-box input{padding-right:48px}
.password-toggle{position:absolute;right:6px;top:6px;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--ink2)}
.password-toggle:hover{background:var(--soft);color:var(--brand2)}
.auth-actions{display:flex;gap:8px;margin-top:18px}
.auth-actions button{height:44px;border-radius:8px;font-size:13px;font-weight:850}
.auth-actions .primary{flex:1;background:var(--brand2);color:#fff;box-shadow:0 10px 22px rgba(0,60,220,.2)}
.auth-actions .primary:disabled{opacity:.58;cursor:progress;box-shadow:none}
.auth-secondary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.auth-help{color:var(--ink3);font-size:11.5px;line-height:1.5}
.text-btn{color:var(--brand2);font-size:12px;font-weight:850;white-space:nowrap}
.scroller{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 10px calc(24px + env(safe-area-inset-bottom));scrollbar-width:thin;scrollbar-color:#D9E0E6 transparent}
.panel[hidden]{display:none}
.empty{
  display:none;margin:56px 24px;color:var(--ink2);text-align:center;font-size:14px;line-height:1.5;
}
.empty.show{display:block}
.masonry{column-count:2;column-gap:8px}
.pin{
  break-inside:avoid;width:100%;display:block;text-align:left;margin:0 0 16px;
  opacity:0;transform:translateY(14px);transition:opacity .42s var(--ease),transform .42s var(--ease);
}
.pin.in{opacity:1;transform:none}
.media-card{
  position:relative;overflow:hidden;border-radius:10px;background:#F1F3F5;
  border:0;box-shadow:none;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s;
}
@media(hover:hover){.pin:hover .media-card{transform:translateY(-2px);box-shadow:var(--shadow2)}}
.thumb{display:block;width:100%;height:auto;aspect-ratio:var(--ratio,3/4);object-fit:cover;background:#E7EBEF}
.pdf-thumb{
  aspect-ratio:var(--ratio,3/4);display:flex;flex-direction:column;justify-content:space-between;
  padding:13px;background:linear-gradient(160deg,#E8F8FD 0%,#F7FAFC 72%);
}
.pdf-badge,.type-badge{
  display:inline-flex;align-items:center;align-self:flex-start;height:24px;padding:0 8px;border-radius:7px;
  background:rgba(255,255,255,.92);color:var(--brand2);font-size:10px;font-weight:850;box-shadow:0 3px 10px rgba(24,34,45,.1);
}
.pdf-title{font-size:16px;font-weight:850;line-height:1.32;color:#2A3037;word-break:keep-all}
.pdf-lines span{display:block;height:6px;border-radius:3px;background:#E7EBEF;margin-top:6px}
.pdf-lines span:nth-child(1){width:92%}.pdf-lines span:nth-child(2){width:72%}.pdf-lines span:nth-child(3){width:48%}
.type-badge{position:absolute;left:9px;top:9px;z-index:2}
.save{
  position:absolute;right:8px;top:8px;z-index:2;height:30px;padding:0 10px;border-radius:999px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:#20242A;font-size:11px;font-weight:850;
}
.save.on{background:var(--brand2);color:#fff}
.pin-info{padding:8px 3px 0}
.pin-info h3{
  margin:0 0 5px;font-size:13px;font-weight:760;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pin-meta{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:11px;font-weight:650}
.pin-actions{display:flex;align-items:center;gap:4px;margin-top:8px;min-height:44px}
.pin-actions button{
  width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#22272E;
  background:transparent;transition:background .2s,color .2s,transform .16s;
}
.pin-actions button:hover{background:var(--brand-soft);color:var(--brand2)}
.pin-actions button:active{transform:scale(.9)}
.pin-actions button.on{color:var(--brand2)}
.pin-actions .count{margin-left:auto;color:var(--ink3);font-size:11px;font-weight:750}
.detail{
  position:absolute;inset:0;z-index:40;background:var(--app);display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;pointer-events:none;
  transition:transform .38s var(--ease),visibility 0s linear .38s;
}
.detail.open{transform:none;visibility:visible;pointer-events:auto;transition:transform .38s var(--ease)}
.detail-head{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(248,249,250,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.detail-title{min-width:0;margin-right:auto}
.detail-title b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-title span{display:block;margin-top:2px;color:var(--ink2);font-size:11px;font-weight:650}
.detail-scroll{flex:1;overflow-y:auto}
.hero-media{background:#E9EEF3;border-bottom:1px solid var(--line)}
.hero-media img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:#111}
.hero-media .pdf-thumb{margin:0;aspect-ratio:1/1;padding:28px}
.actions{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.actions button,.actions a{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink);transition:background .2s,color .2s,transform .16s}
.actions button:hover,.actions a:hover{background:var(--surface);color:var(--brand2)}
.actions button:active,.actions a:active{transform:scale(.9)}
.actions .bookmark{margin-left:auto}
.actions .on{color:var(--brand2)}
.caption{padding:0 16px 16px;margin:0;font-size:13.5px;line-height:1.6;color:#343A42}
.caption b{font-weight:800;margin-right:6px}
.tagline{display:block;margin-top:8px;color:#4C86A2;font-size:12px;font-weight:650}
.cta-row{display:flex;gap:8px;padding:0 16px 18px}
.btn{flex:1;text-align:center;padding:13px;border-radius:8px;font-size:13px;font-weight:800;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff;box-shadow:0 10px 20px rgba(0,60,220,.2)}
.comments{border-top:1px solid var(--line);padding:16px}
.comments-head{display:flex;align-items:center;margin:0 0 12px;color:var(--ink);font-size:13px;font-weight:850}
.comments-head span{margin-left:5px;color:var(--ink3)}
.comment-list{display:grid;gap:11px;margin-bottom:12px}
.comment{font-size:13px;line-height:1.5;color:#343A42}
.comment b{display:block;margin-bottom:2px;font-size:12px;color:var(--ink);font-weight:850}
.comment-empty{margin:0 0 12px;color:var(--ink3);font-size:13px}
.comment-form{display:flex;gap:8px}
.comment-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 13px;background:#F7F9FA;outline:0;color:var(--ink);font-size:13px}
.comment-form button{height:40px;padding:0 14px;border-radius:999px;background:var(--brand2);color:#fff;font-size:13px;font-weight:850}
.toast{
  position:absolute;left:50%;bottom:24px;z-index:90;transform:translate(-50%,16px);
  opacity:0;pointer-events:none;background:rgba(32,36,42,.96);color:#fff;padding:12px 16px;
  border-radius:8px;font-size:12.5px;font-weight:760;box-shadow:0 12px 28px rgba(32,36,42,.28);
  transition:opacity .28s var(--ease),transform .28s var(--ease);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.brand b{font-size:17px}.masonry{column-gap:7px}.scroller{padding-left:8px;padding-right:8px}.pin{margin-bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}.pin{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="appbar">
    <div class="brand"><b>전환법인 <span>라운지</span></b></div>
    <button class="user-chip" id="userChip" type="button" hidden></button>
    <a class="icon-btn" id="adminLink" href="admin.html" aria-label="관리자" hidden>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </a>
    <button class="icon-btn" id="bellBtn" aria-label="알림">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="notice-dot"></span>
    </button>
  </header>

  <nav class="tabs" role="tablist" id="tabs" hidden>
    <span class="tab-ind" id="ind"></span>
    <button class="tab" role="tab" aria-selected="true" aria-controls="p-all">전체</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-product">상품</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-award">시상</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-mixed">복합</button>
  </nav>
  <div class="search-wrap" id="searchWrap" hidden>
    <label class="search-box" for="searchInput">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="제목, 태그, 작성자 검색">
    </label>
  </div>

  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <p class="auth-kicker">JB Bullet</p>
      <h1>자료 열람 로그인</h1>
      <p>관리자가 발급한 계정으로 로그인하면 상품과 시상 자료를 확인할 수 있습니다.</p>
      <form id="authForm">
        <div class="auth-field"><label for="authEmail">아이디</label><input id="authEmail" type="email" autocomplete="username" inputmode="email" placeholder="이메일 주소" required></div>
        <div class="auth-field">
          <label for="authPassword">비밀번호</label>
          <div class="password-box">
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호" required minlength="6">
            <button class="password-toggle" id="togglePassword" type="button" aria-label="비밀번호 보기" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-actions"><button class="primary" id="signInBtn" type="submit">로그인</button></div>
        <div class="auth-secondary"><span class="auth-help">계정이 없으면 관리자에게 요청하세요.</span><button class="text-btn" id="resetPasswordBtn" type="button">비밀번호 재설정</button></div>
      </form>
      <form id="passwordResetForm" hidden>
        <div class="auth-field">
          <label for="newPassword">새 비밀번호</label>
          <div class="password-box">
            <input id="newPassword" type="password" autocomplete="new-password" placeholder="6자 이상 입력" required minlength="6">
            <button class="password-toggle" id="toggleNewPassword" type="button" aria-label="새 비밀번호 보기" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-actions"><button class="primary" id="updatePasswordBtn" type="submit">새 비밀번호 저장</button></div>
        <span class="auth-help">저장 후 바로 자료 화면으로 이동합니다.</span>
      </form>
    </div>
  </section>

  <main class="scroller" id="scroller" hidden>
    <div class="unread-filter" id="unreadFilter"><span id="unreadFilterText"></span><button type="button" id="clearUnreadFilter">전체 보기</button></div>
    <section class="panel" id="p-all" role="tabpanel"><div class="masonry" id="gridAll"></div><p class="empty" id="emptyAll">아직 등록된 자료가 없습니다.<br>새 자료가 등록되면 여기에 표시됩니다.</p></section>
    <section class="panel" id="p-product" role="tabpanel" hidden><div class="masonry" id="gridProduct"></div><p class="empty" id="emptyProduct">등록된 상품 자료가 없습니다.</p></section>
    <section class="panel" id="p-award" role="tabpanel" hidden><div class="masonry" id="gridAward"></div><p class="empty" id="emptyAward">등록된 시상 자료가 없습니다.</p></section>
    <section class="panel" id="p-mixed" role="tabpanel" hidden><div class="masonry" id="gridMixed"></div><p class="empty" id="emptyMixed">등록된 복합 자료가 없습니다.</p></section>
  </main>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-head">
      <button class="icon-btn" id="backBtn" aria-label="뒤로">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="detail-title"><b id="dTitle"></b><span id="dMeta"></span></div>
    </div>
    <div class="detail-scroll">
      <div class="hero-media" id="dMedia"></div>
      <div class="actions">
        <button id="likeBtn" aria-label="좋아요" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.3A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.7C19 15.4 12 20 12 20z"/></svg>
        </button>
        <button id="focusCommentBtn" aria-label="댓글">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linejoin="round"><path d="M21 11.5a8 8 0 0 1-11.6 7.1L4 20l1.5-4.9A8 8 0 1 1 21 11.5z"/></svg>
        </button>
        <button id="shareBtn" aria-label="공유">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linejoin="round"><path d="M21 3 3 10.5l7.5 3L14 21z"/></svg>
        </button>
        <button id="downloadBtn" aria-label="다운로드">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="bookmark" id="saveBtn" aria-label="저장" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
        </button>
      </div>
      <p class="caption" id="dCaption"></p>
      <div class="cta-row" id="dCta"></div>
      <section class="comments">
        <p class="comments-head">댓글 <span id="commentCount">0</span></p>
        <div class="comment-list" id="commentList"></div>
        <p class="comment-empty" id="commentEmpty">아직 댓글이 없습니다.</p>
        <form class="comment-form" id="commentForm">
          <input id="commentInput" type="text" placeholder="댓글 달기">
          <button type="submit">게시</button>
        </form>
      </section>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-config.js"></script>
<script>
const STORE_KEY='fpLoungePosts';
const SEEN_KEY='fpSeenPosts';
const COMMENT_KEY='fpPostComments';
const liked=new Set(JSON.parse(localStorage.getItem('fpLiked')||'[]'));
const saved=new Set(JSON.parse(localStorage.getItem('fpSaved')||'[]'));
const seen=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'));
let comments=JSON.parse(localStorage.getItem(COMMENT_KEY)||'{}');
let posts=[], current=null;
let unreadOnly=false;
let searchQuery='';
let currentSession=null;
let passwordRecoveryMode=location.hash.includes('type=recovery')||location.search.includes('type=recovery');
let moveTabIndicator=()=>{};
const grids={all:document.getElementById('gridAll'),product:document.getElementById('gridProduct'),award:document.getElementById('gridAward'),mixed:document.getElementById('gridMixed')};
const empties={all:document.getElementById('emptyAll'),product:document.getElementById('emptyProduct'),award:document.getElementById('emptyAward'),mixed:document.getElementById('emptyMixed')};
let SUPABASE_CONFIG=window.FP_LOUNGE_SUPABASE||{};
let supabaseClient=SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey&&window.supabase
  ? window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey)
  : null;

async function loadPosts(){
  await configureSupabase();
  if(supabaseClient){
    const {data,error}=await supabaseClient.from('fp_posts').select('*').order('created_at',{ascending:false});
    if(!error&&Array.isArray(data)){
      posts=data.map(rowToPost);
      return;
    }
  }
  let custom=[];
  try{custom=JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){custom=[]}
  posts=custom;
}
function rowToPost(row){
  return {
    id:String(row.id),
    type:row.type||'image',
    title:row.title||'제목 없음',
    author:row.author||'관리자',
    date:formatDate(row.created_at),
    category:row.category||'상품',
    tags:row.tags||[],
    ratio:row.ratio||'4/5',
    src:row.media_url||'',
    downloadUrl:row.download_url||row.media_url||'',
    webViewUrl:row.web_view_url||row.media_url||'',
    driveFileId:row.drive_file_id||'',
    desc:row.description||''
  };
}
function formatDate(value){
  const d=value?new Date(value):new Date();
  if(Number.isNaN(d.getTime()))return '';
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function mediaMarkup(post,large=false){
  if(post.type==='pdf'){
    return `<div class="pdf-thumb" style="--ratio:${post.ratio||'3/4'}"><span class="pdf-badge">PDF</span><div class="pdf-title">${escapeHtml(post.title)}</div><div class="pdf-lines"><span></span><span></span><span></span></div></div>`;
  }
  return `<img class="thumb" src="${post.src}" alt="${escapeHtml(post.title)}" style="--ratio:${post.ratio||'3/4'}" loading="${large?'eager':'lazy'}" referrerpolicy="no-referrer">`;
}
function card(post){
  const isSaved=saved.has(post.id), isLiked=liked.has(post.id);
  const commentCount=(comments[post.id]||[]).length;
  return `<article class="pin ${isLiked?'liked':''}" data-id="${post.id}">
    <div class="media-card">
      ${post.type==='pdf'?'<span class="type-badge">PDF</span>':''}
      ${mediaMarkup(post)}
      <button class="save ${isSaved?'on':''}" data-save="${post.id}">${isSaved?'저장됨':'저장'}</button>
    </div>
    <div class="pin-info">
      <h3>${escapeHtml(post.title)}</h3>
      <div class="pin-meta"><span>${escapeHtml(post.author||'관리자')}</span><span>${escapeHtml(post.date||'')}</span></div>
      <div class="pin-actions">
        <button class="${isLiked?'on':''}" data-like="${post.id}" aria-label="좋아요">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${isLiked?'currentColor':'none'}" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.3A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.7C19 15.4 12 20 12 20z"/></svg>
        </button>
        <button data-comment="${post.id}" aria-label="댓글">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M21 11.5a8 8 0 0 1-11.6 7.1L4 20l1.5-4.9A8 8 0 1 1 21 11.5z"/></svg>
        </button>
        <button data-share="${post.id}" aria-label="공유">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7.5 3L14 21z"/></svg>
        </button>
        <button data-download="${post.id}" aria-label="다운로드">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        ${commentCount?`<span class="count">${commentCount}</span>`:''}
      </div>
    </div>
  </article>`;
}
async function render(){
  await loadPosts();
  const searchedPosts=posts.filter(matchesSearch);
  const visiblePosts=unreadOnly?searchedPosts.filter(p=>isUnread(p)):searchedPosts;
  const groups={
    all:visiblePosts,
    product:visiblePosts.filter(p=>p.category==='상품'),
    award:visiblePosts.filter(p=>p.category==='시상'),
    mixed:visiblePosts.filter(p=>p.category==='복합')
  };
  Object.entries(groups).forEach(([key,list])=>{
    grids[key].innerHTML=list.map(card).join('');
    empties[key].classList.toggle('show',list.length===0);
    reveal(grids[key].querySelectorAll('.pin'));
  });
  updateUnreadUi();
}
async function initAuth(){
  await configureSupabase();
  if(!supabaseClient){
    showAuth();
    toast('Supabase 공개 환경변수가 필요합니다');
    bindFeed();
    return;
  }
  const {data}=await supabaseClient.auth.getSession();
  applySession(data.session);
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'){showPasswordReset(session);return}
    applySession(session);
  });
  bindFeed();
}
async function configureSupabase(){
  if(supabaseClient||!window.supabase)return supabaseClient;
  if(!SUPABASE_CONFIG.url||!SUPABASE_CONFIG.publishableKey){
    try{
      const response=await fetch('/api/config',{cache:'no-store'});
      if(response.ok){
        const config=await response.json();
        SUPABASE_CONFIG={
          ...SUPABASE_CONFIG,
          url:config.supabaseUrl||SUPABASE_CONFIG.url,
          publishableKey:config.supabasePublishableKey||SUPABASE_CONFIG.publishableKey
        };
      }
    }catch(error){}
  }
  if(SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey){
    supabaseClient=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey);
  }
  return supabaseClient;
}
function applySession(session){
  currentSession=session||null;
  if(passwordRecoveryMode&&currentSession){showPasswordReset(currentSession);return}
  if(currentSession){
    showFeed(currentSession);
    render();
  }else{
    showAuth();
  }
}
function showAuth(){
  passwordRecoveryMode=false;
  document.getElementById('authForm').hidden=false;
  document.getElementById('passwordResetForm').hidden=true;
  document.getElementById('authScreen').hidden=false;
  document.getElementById('tabs').hidden=true;
  document.getElementById('searchWrap').hidden=true;
  document.getElementById('scroller').hidden=true;
  document.getElementById('userChip').hidden=true;
  document.getElementById('adminLink').hidden=true;
}
function showPasswordReset(session){
  passwordRecoveryMode=true;
  currentSession=session||currentSession;
  document.getElementById('authForm').hidden=true;
  document.getElementById('passwordResetForm').hidden=false;
  document.getElementById('authScreen').hidden=false;
  document.getElementById('tabs').hidden=true;
  document.getElementById('searchWrap').hidden=true;
  document.getElementById('scroller').hidden=true;
  document.getElementById('userChip').hidden=true;
  document.getElementById('adminLink').hidden=true;
  setTimeout(()=>document.getElementById('newPassword').focus(),80);
}
function showFeed(session){
  passwordRecoveryMode=false;
  document.getElementById('authForm').hidden=false;
  document.getElementById('passwordResetForm').hidden=true;
  document.getElementById('authScreen').hidden=true;
  document.getElementById('tabs').hidden=false;
  document.getElementById('searchWrap').hidden=false;
  document.getElementById('scroller').hidden=false;
  document.getElementById('adminLink').hidden=false;
  const chip=document.getElementById('userChip');
  chip.hidden=!session;
  chip.textContent=session&&session.user&&session.user.email?session.user.email:'';
  requestAnimationFrame(moveTabIndicator);
}
function bindFeed(){
  document.querySelector('.scroller').addEventListener('click',e=>{
    const saveBtn=e.target.closest('[data-save]');
    if(saveBtn){
      const id=saveBtn.dataset.save;
      const on=!saved.has(id);
      on?saved.add(id):saved.delete(id);
      localStorage.setItem('fpSaved',JSON.stringify([...saved]));
      document.querySelectorAll(`[data-save="${CSS.escape(id)}"]`).forEach(btn=>{btn.classList.toggle('on',on);btn.textContent=on?'저장됨':'저장'});
      toast(on?'자료를 저장했습니다':'저장을 취소했습니다');
      return;
    }
    const shareBtn=e.target.closest('[data-share]');
    if(shareBtn){
      sharePost(shareBtn.dataset.share);
      return;
    }
    const downloadBtn=e.target.closest('[data-download]');
    if(downloadBtn){
      downloadPost(downloadBtn.dataset.download);
      return;
    }
    const likeBtn=e.target.closest('[data-like]');
    if(likeBtn){
      toggleLike(likeBtn.dataset.like);
      return;
    }
    const commentBtn=e.target.closest('[data-comment]');
    if(commentBtn){
      openDetail(commentBtn.dataset.comment,true);
      return;
    }
    const pin=e.target.closest('.pin');
    if(pin)openDetail(pin.dataset.id);
  });
}
function reveal(nodes){[...nodes].forEach((el,i)=>setTimeout(()=>el.classList.add('in'),30+i*35))}
function openDetail(id,focusComment=false){
  current=posts.find(p=>p.id===id);
  if(!current)return;
  markSeen(current.id);
  document.getElementById('dTitle').textContent=current.title;
  document.getElementById('dMeta').textContent=`${current.author||'관리자'} · ${current.category||'자료'} · ${current.date||''}`;
  document.getElementById('dMedia').innerHTML=mediaMarkup(current,true);
  document.getElementById('dCaption').innerHTML=`<b>${escapeHtml(current.author||'관리자')}</b>${escapeHtml(current.desc||current.title)}<span class="tagline">${(current.tags||[]).map(t=>'#'+escapeHtml(t)).join(' ')}</span>`;
  document.getElementById('dCta').innerHTML='';
  renderComments();
  syncDetail();
  render();
  document.getElementById('detail').classList.add('open');
  document.getElementById('detail').setAttribute('aria-hidden','false');
  if(focusComment)setTimeout(()=>document.getElementById('commentInput').focus(),250);
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('detail').setAttribute('aria-hidden','true');
  current=null;
}
function syncDetail(){
  if(!current)return;
  document.getElementById('likeBtn').classList.toggle('on',liked.has(current.id));
  document.getElementById('likeBtn').setAttribute('aria-pressed',liked.has(current.id));
  document.getElementById('saveBtn').classList.toggle('on',saved.has(current.id));
  document.getElementById('saveBtn').setAttribute('aria-pressed',saved.has(current.id));
}
function toggleLike(id){
  liked.has(id)?liked.delete(id):liked.add(id);
  localStorage.setItem('fpLiked',JSON.stringify([...liked]));
  render();
  if(current&&current.id===id)syncDetail();
}
async function renderComments(){
  if(!current)return;
  let list=[];
  if(supabaseClient&&isRemotePost(current)){
    const {data,error}=await supabaseClient.from('fp_comments').select('*').eq('post_id',current.id).order('created_at',{ascending:true});
    if(!error&&Array.isArray(data))list=data.map(c=>({author:c.author||'방문자',text:c.text||''}));
  }else{
    comments=JSON.parse(localStorage.getItem(COMMENT_KEY)||'{}');
    list=comments[current.id]||[];
  }
  document.getElementById('commentCount').textContent=list.length;
  document.getElementById('commentEmpty').style.display=list.length?'none':'block';
  document.getElementById('commentList').innerHTML=list.map(c=>`<div class="comment"><b>${escapeHtml(c.author)}</b>${escapeHtml(c.text)}</div>`).join('');
}
async function addComment(text){
  if(!current)return;
  if(supabaseClient&&isRemotePost(current)){
    const author=currentSession&&currentSession.user&&currentSession.user.email?currentSession.user.email:'방문자';
    const {error}=await supabaseClient.from('fp_comments').insert({post_id:current.id,author,text});
    if(error){toast('댓글 저장에 실패했습니다');return}
    await renderComments();
    render();
    return;
  }
  comments=JSON.parse(localStorage.getItem(COMMENT_KEY)||'{}');
  comments[current.id]=[...(comments[current.id]||[]),{author:'방문자',text,at:Date.now()}];
  localStorage.setItem(COMMENT_KEY,JSON.stringify(comments));
  renderComments();
  render();
}
function setupTabs(){
  const tabs=[...document.querySelectorAll('.tab')], ind=document.getElementById('ind');
  const move=()=>{const on=tabs.find(t=>t.getAttribute('aria-selected')==='true');ind.style.width=on.offsetWidth+'px';ind.style.transform=`translateX(${on.offsetLeft-16}px)`};
  moveTabIndicator=move;
  tabs.forEach(tab=>tab.addEventListener('click',()=>{
    tabs.forEach(t=>{
      const active=t===tab;
      t.setAttribute('aria-selected',active);
      document.getElementById(t.getAttribute('aria-controls')).hidden=!active;
    });
    document.getElementById('scroller').scrollTo({top:0,behavior:'smooth'});
    move();
  }));
  window.addEventListener('resize',move);
  requestAnimationFrame(move);
  document.fonts?.ready.then(move);
}
function matchesSearch(post){
  const q=searchQuery.trim().toLowerCase();
  if(!q)return true;
  return [post.title,post.author,post.category,post.desc,...(post.tags||[])]
    .filter(Boolean).join(' ').toLowerCase().includes(q);
}
function isRemotePost(post){return post&&!String(post.id).startsWith('post-')}
function isUnread(post){return isRemotePost(post)&&!seen.has(post.id)}
function unreadPosts(){return posts.filter(p=>isUnread(p))}
function markSeen(id){
  if(seen.has(id))return;
  seen.add(id);
  localStorage.setItem(SEEN_KEY,JSON.stringify([...seen]));
}
function updateUnreadUi(){
  const count=unreadPosts().length;
  const bell=document.getElementById('bellBtn');
  const filter=document.getElementById('unreadFilter');
  const filterText=document.getElementById('unreadFilterText');
  bell.classList.toggle('has-unread',count>0);
  bell.setAttribute('aria-label',count>0?`미확인 게시물 ${count}개`:'알림');
  filter.classList.toggle('show',unreadOnly);
  filterText.textContent=count>0?`미확인 게시물 ${count}개를 보고 있습니다`:'미확인 게시물이 없습니다';
}
function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getAuthErrorMessage(error){
  const message=String(error&&error.message?error.message:'').toLowerCase();
  if(message.includes('invalid login credentials'))return '아이디 또는 비밀번호를 확인해 주세요';
  if(message.includes('email not confirmed'))return '이메일 인증 후 로그인해 주세요';
  if(message.includes('rate limit'))return '요청이 많습니다. 잠시 후 다시 시도해 주세요';
  return error&&error.message?error.message:'로그인 처리에 실패했습니다';
}
let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),1800)}
async function sharePost(id){
  const post=posts.find(p=>p.id===id);
  const url=`${location.origin}${location.pathname}#post-${encodeURIComponent(id)}`;
  try{
    if(navigator.share&&post){await navigator.share({title:post.title,text:post.desc||post.title,url})}
    else{await navigator.clipboard.writeText(url);toast('게시물 링크를 복사했습니다')}
  }catch(e){
    try{await navigator.clipboard.writeText(url);toast('게시물 링크를 복사했습니다')}catch(err){toast('공유를 준비했습니다')}
  }
}
function downloadPost(id){
  const post=posts.find(p=>p.id===id);
  const href=post&&(post.downloadUrl||post.webViewUrl||post.src);
  if(!href){toast('다운로드 링크가 없습니다');return}
  const link=document.createElement('a');
  link.href=href;
  link.download=post.title||'download';
  link.target='_blank';
  link.rel='noopener';
  document.body.appendChild(link);
  link.click();
  link.remove();
  toast('다운로드를 시작합니다');
}
document.getElementById('scroller').addEventListener('scroll',e=>document.getElementById('app').classList.toggle('scrolled',e.currentTarget.scrollTop>6),{passive:true});
document.getElementById('backBtn').addEventListener('click',closeDetail);
document.getElementById('likeBtn').addEventListener('click',()=>{
  if(!current)return;
  toggleLike(current.id);
});
document.getElementById('saveBtn').addEventListener('click',()=>{
  if(!current)return;
  saved.has(current.id)?saved.delete(current.id):saved.add(current.id);
  localStorage.setItem('fpSaved',JSON.stringify([...saved]));
  render();syncDetail();toast(saved.has(current.id)?'자료를 저장했습니다':'저장을 취소했습니다');
});
document.getElementById('shareBtn').addEventListener('click',()=>{if(current)sharePost(current.id)});
document.getElementById('downloadBtn').addEventListener('click',()=>{if(current)downloadPost(current.id)});
document.getElementById('focusCommentBtn').addEventListener('click',()=>{
  document.getElementById('commentInput').focus();
  document.getElementById('commentForm').scrollIntoView({behavior:'smooth',block:'center'});
});
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQuery=e.target.value;
  render();
});
document.getElementById('commentForm').addEventListener('submit',e=>{
  e.preventDefault();
  const input=document.getElementById('commentInput');
  const text=input.value.trim();
  if(!text)return;
  addComment(text);
  input.value='';
  toast('댓글을 등록했습니다');
});
document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!supabaseClient){toast('Supabase 공개 설정이 필요합니다');return}
  const button=document.getElementById('signInBtn');
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  button.disabled=true;
  button.textContent='확인 중';
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  button.disabled=false;
  button.textContent='로그인';
  if(error){toast(getAuthErrorMessage(error));return}
  toast('로그인되었습니다');
});
document.getElementById('togglePassword').addEventListener('click',()=>togglePasswordInput('authPassword','togglePassword','비밀번호'));
document.getElementById('toggleNewPassword').addEventListener('click',()=>togglePasswordInput('newPassword','toggleNewPassword','새 비밀번호'));
document.getElementById('resetPasswordBtn').addEventListener('click',async()=>{
  if(!supabaseClient){toast('Supabase 공개 설정이 필요합니다');return}
  const email=document.getElementById('authEmail').value.trim();
  if(!email){toast('아이디에 이메일 주소를 먼저 입력해 주세요');return}
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error){toast(getAuthErrorMessage(error));return}
  toast('비밀번호 재설정 메일을 보냈습니다');
});
document.getElementById('passwordResetForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!supabaseClient){toast('Supabase 공개 설정이 필요합니다');return}
  const button=document.getElementById('updatePasswordBtn');
  const password=document.getElementById('newPassword').value;
  if(password.length<6){toast('비밀번호는 6자 이상 입력해 주세요');return}
  button.disabled=true;
  button.textContent='저장 중';
  const {error}=await supabaseClient.auth.updateUser({password});
  button.disabled=false;
  button.textContent='새 비밀번호 저장';
  if(error){toast(getAuthErrorMessage(error));return}
  document.getElementById('passwordResetForm').reset();
  passwordRecoveryMode=false;
  toast('비밀번호를 변경했습니다');
  const {data}=await supabaseClient.auth.getSession();
  applySession(data.session);
});
function togglePasswordInput(inputId,buttonId,label){
  const input=document.getElementById(inputId);
  const button=document.getElementById(buttonId);
  const visible=input.type==='text';
  input.type=visible?'password':'text';
  button.setAttribute('aria-pressed',String(!visible));
  button.setAttribute('aria-label',visible?`${label} 보기`:`${label} 숨기기`);
}
document.getElementById('userChip').addEventListener('click',async()=>{
  if(supabaseClient)await supabaseClient.auth.signOut();
});
document.getElementById('bellBtn').addEventListener('click',async()=>{
  await loadPosts();
  const count=unreadPosts().length;
  if(!count){unreadOnly=false;render();toast('새로운 알림이 없습니다');return}
  unreadOnly=true;
  document.querySelector('.tab[aria-controls="p-all"]').click();
  render();
  toast(`미확인 게시물 ${count}개`);
});
document.getElementById('clearUnreadFilter').addEventListener('click',()=>{
  unreadOnly=false;
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
window.addEventListener('storage',e=>{if(e.key===STORE_KEY||e.key===SEEN_KEY)render()});
setupTabs();initAuth();
if(location.hash.startsWith('#post-')){
  const id=decodeURIComponent(location.hash.replace('#post-',''));
  setTimeout(()=>openDetail(id),300);
}
</script>
</body>
</html>
