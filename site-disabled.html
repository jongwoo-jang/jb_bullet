<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>접속 일시 중단</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F3F5F7;color:#20242A}
body{display:grid;place-items:center;padding:28px}
.wrap{width:min(420px,100%);padding:34px 24px;border:1px solid #ECEFF2;border-radius:22px;background:#fff;box-shadow:0 16px 38px rgba(24,34,45,.1);text-align:center}
.mark{width:54px;height:54px;margin:0 auto 18px;border-radius:16px;background:#003CDC;display:grid;place-items:center}
.mark:before{content:"";width:24px;height:4px;border-radius:999px;background:#fff;box-shadow:0 9px 0 #fff,0 -9px 0 #fff}
h1{margin:0;color:#20242A;font-size:25px;font-weight:900;letter-spacing:0;line-height:1.25}
p{margin:14px 0 0;color:#626B76;font-size:15.5px;font-weight:760;line-height:1.62;word-break:keep-all}
.sub{margin-top:22px;padding-top:18px;border-top:1px solid #ECEFF2;color:#A4ACB5;font-size:13px;font-weight:760}
</style>
</head>
<body>
<main class="wrap" role="main" aria-labelledby="title">
  <div class="mark" aria-hidden="true"></div>
  <h1 id="title">접속이 일시 중단되었습니다</h1>
  <p>현재 전환법인 라운지는 점검 또는 운영 사유로 접속이 제한되어 있습니다.</p>
  <p class="sub">관리자 확인 후 다시 이용해 주세요.</p>
</main>
</body>
</html>
