<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전환법인 라운지 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#F3F5F7;--surface:#fff;--ink:#20242A;--ink2:#626B76;--ink3:#A4ACB5;--brand:#5BC2E7;--brand2:#003CDC;--line:#ECEFF2;--soft:#E8F8FD;--shadow:0 12px 32px rgba(24,34,45,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;letter-spacing:0}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{width:min(980px,100%);margin:0 auto;padding:24px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.top h1{font-size:20px;margin:0;font-weight:850}
.top a{margin-left:auto;height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink2)}
.account{height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:8px;background:#20242A;color:#fff;font-size:12px;font-weight:850}
.account[hidden]{display:none}
.layout{display:grid;grid-template-columns:minmax(0,392px) 1fr;gap:24px;align-items:start}
.layout[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.settings-panel{grid-column:1/-1;padding:16px}
.settings-panel h2{margin:0 0 4px;font-size:16px;font-weight:850}
.settings-panel p{margin:0 0 16px;color:var(--ink2);font-size:13px;line-height:1.5}
.passcode-form{display:grid;grid-template-columns:minmax(0,180px) auto 1fr;gap:8px;align-items:end}
.passcode-form .field{margin:0}
.passcode-form button{height:48px;padding:0 16px}
.passcode-status{align-self:center;color:var(--ink3);font-size:12px;font-weight:750}
.auth-panel{width:min(420px,100%);margin:72px auto 0;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.auth-panel[hidden]{display:none}
.auth-kicker{margin:0 0 10px;color:var(--brand2);font-size:12px;font-weight:900}
.auth-panel h2{margin:0 0 8px;font-size:22px;line-height:1.25}
.auth-panel > p:not(.auth-kicker){margin:0 0 18px;color:var(--ink2);font-size:13px;line-height:1.55}
.auth-actions{display:flex;gap:8px;margin-top:16px}
.password-box{position:relative}
.password-box input{padding-right:48px}
.password-toggle{position:absolute;right:6px;top:6px;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:transparent;color:var(--ink2)}
.password-toggle:hover{background:var(--soft);color:var(--brand2)}
.auth-secondary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.text-btn{background:transparent;color:var(--brand2);font-size:12px;font-weight:850;white-space:nowrap}
.form{padding:16px}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:8px;font-size:12px;font-weight:850;color:var(--ink2)}
.field input,.field textarea,.field select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;background:#FBFCFD;color:var(--ink);padding:12px;outline:none}
.field input::placeholder,.field textarea::placeholder{color:var(--ink3)}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.drop{border:1px dashed #C9D2DB;border-radius:8px;background:#FBFCFD;padding:24px 16px;text-align:center;color:var(--ink2)}
.drop input{display:none}
.drop b{display:block;font-size:14px;color:var(--ink);margin-bottom:5px}
.preview{margin-top:12px;border-radius:8px;overflow:hidden;background:#EEF2F5;border:1px solid var(--line);display:none}
.preview.show{display:block}
.preview img{display:block;width:100%;max-height:360px;object-fit:contain;background:#111}
.preview .pdf{aspect-ratio:4/3;display:grid;place-items:center;font-weight:850;color:var(--brand2);background:var(--soft)}
.actions{display:flex;gap:8px;margin-top:24px}
.primary,.ghost,.danger{min-height:48px;border-radius:8px;font-weight:850}
.primary{flex:1;background:var(--brand2);color:#fff;box-shadow:0 10px 22px rgba(0,60,220,.2)}
.primary:disabled{opacity:.58;cursor:progress;box-shadow:none}
.ghost{padding:0 14px;background:#F4F6F8;color:var(--ink2)}
.danger{padding:0 12px;background:#EDF6FF;color:var(--brand2)}
.hint{margin:9px 0 0;color:var(--ink3);font-size:11.5px;line-height:1.5}
.tag-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag-chip{height:32px;padding:0 12px;border-radius:999px;background:#F4F6F8;color:var(--ink2);font-size:12px;font-weight:800}
.tag-chip:hover,.tag-chip.on{background:var(--soft);color:var(--brand2)}
.list{padding:16px}
.list-head{display:flex;align-items:center;padding:0 0 16px}
.list-head b{font-size:14px}
.list-head button{margin-left:auto;background:#F4F6F8;color:var(--ink2);min-height:40px;border-radius:8px;padding:0 12px;font-size:12px;font-weight:800}
.admin-search{padding:0 0 16px}
.admin-search label{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:#FBFCFD;color:var(--ink2)}
.admin-search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}
.admin-search input::placeholder{color:var(--ink3)}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.item-media{width:74px;height:88px;border-radius:8px;overflow:hidden;background:#EEF2F5}
.item-media img{width:100%;height:100%;object-fit:cover}
.item-media .pdf{width:100%;height:100%;display:grid;place-items:center;background:var(--soft);color:var(--brand2);font-size:12px;font-weight:900}
.item h3{font-size:13px;line-height:1.35;margin:0 0 5px;font-weight:820}
.item p{margin:0;color:var(--ink2);font-size:11px;font-weight:650}
.empty{padding:48px 10px;text-align:center;color:var(--ink3);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;background:rgba(32,36,42,.96);color:#fff;border-radius:8px;padding:12px 16px;font-size:13px;font-weight:760;transition:.24s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.layout{grid-template-columns:1fr;gap:16px}.passcode-form{grid-template-columns:1fr}.passcode-status{align-self:auto}.top{position:sticky;top:0;z-index:5;background:rgba(238,243,247,.88);backdrop-filter:blur(14px);padding:12px 0;margin-top:-12px;margin-bottom:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>자료 관리자</h1>
    <button class="account" id="signOutBtn" type="button" hidden>로그아웃</button>
    <a href="index.html">피드 보기</a>
  </header>

  <section class="auth-panel" id="authPanel">
    <p class="auth-kicker">관리자</p>
    <h2>관리자 로그인</h2>
    <p>등록된 관리자 계정으로 로그인하면 자료를 업로드하고 게시물을 관리할 수 있습니다.</p>
    <form id="authForm">
      <div class="field"><label for="authEmail">아이디</label><input id="authEmail" type="email" autocomplete="username" inputmode="email" placeholder="관리자 이메일 주소" required></div>
      <div class="field">
        <label for="authPassword">비밀번호</label>
        <div class="password-box">
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호" required minlength="6">
          <button class="password-toggle" id="togglePassword" type="button" aria-label="비밀번호 보기" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-actions"><button class="primary" id="signInBtn" type="submit">로그인</button></div>
      <div class="auth-secondary"><span class="hint">등록된 관리자 계정만 접근할 수 있습니다.</span><button class="text-btn" id="resetPasswordBtn" type="button">비밀번호 재설정</button></div>
    </form>
    <form id="passwordResetForm" hidden>
      <div class="field">
        <label for="newPassword">새 비밀번호</label>
        <div class="password-box">
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="6자 이상 입력" required minlength="6">
          <button class="password-toggle" id="toggleNewPassword" type="button" aria-label="새 비밀번호 보기" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-actions"><button class="primary" id="updatePasswordBtn" type="submit">새 비밀번호 저장</button></div>
      <p class="hint">저장 후 관리자 화면으로 이동합니다.</p>
    </form>
  </section>

  <div class="layout" id="adminLayout" hidden>
    <section class="panel form">
      <form id="postForm">
        <div class="field">
          <label for="file">사진 또는 PDF</label>
          <label class="drop" for="file">
            <b>파일 선택</b>
            <span>JPG, PNG, WebP, PDF를 등록할 수 있습니다.</span>
            <input id="file" type="file" accept="image/*,.pdf,application/pdf" required>
          </label>
          <div class="preview" id="preview"></div>
        </div>
        <div class="field"><label for="title">제목</label><input id="title" required placeholder="예: 8월 신상품 핵심 이미지"></div>
        <div class="field"><label for="category">분류</label><select id="category"><option>상품</option><option>시상</option><option>복합</option></select></div>
        <div class="field"><label for="author">작성자</label><input id="author" value="관리자"></div>
        <div class="field"><label for="tags">태그</label><input id="tags" placeholder="쉼표로 구분해 입력"><div class="tag-suggestions" id="tagSuggestions" aria-label="최근 태그"></div></div>
        <div class="field"><label for="desc">설명</label><textarea id="desc" placeholder="피드 상세 화면에 표시할 짧은 설명"></textarea></div>
        <div class="actions"><button class="primary" type="submit">게시하기</button><button class="ghost" type="reset">초기화</button></div>
      </form>
    </section>

    <section class="panel list">
      <div class="list-head"><b>등록한 자료</b><button id="clearBtn" type="button">전체 삭제</button></div>
      <div class="admin-search">
        <label for="adminSearch">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="adminSearch" type="search" placeholder="제목 또는 태그로 조회">
        </label>
      </div>
      <div id="postList"></div>
    </section>

    <section class="panel settings-panel">
      <h2>일반 사용자 접속 비밀번호</h2>
      <p>일반 사용자는 이메일 로그인 없이 이 4자리 비밀번호로 자료 화면에 접속합니다.</p>
      <form class="passcode-form" id="passcodeForm">
        <div class="field"><label for="publicPasscode">비밀번호</label><input id="publicPasscode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4자리 숫자" required></div>
        <button class="primary" id="savePasscodeBtn" type="submit">저장</button>
        <span class="passcode-status" id="passcodeStatus">상태 확인 중</span>
      </form>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-config.js"></script>
<script>
const STORE_KEY='fpLoungePosts';
const form=document.getElementById('postForm');
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const list=document.getElementById('postList');
const adminSearch=document.getElementById('adminSearch');
const tagSuggestions=document.getElementById('tagSuggestions');
const authPanel=document.getElementById('authPanel');
const authForm=document.getElementById('authForm');
const signOutBtn=document.getElementById('signOutBtn');
const adminLayout=document.getElementById('adminLayout');
const passcodeForm=document.getElementById('passcodeForm');
const publicPasscode=document.getElementById('publicPasscode');
const savePasscodeBtn=document.getElementById('savePasscodeBtn');
const passcodeStatus=document.getElementById('passcodeStatus');
const submitButton=form.querySelector('button[type="submit"]');
let selected=null;
let currentSession=null;
let passwordRecoveryMode=location.hash.includes('type=recovery')||location.search.includes('type=recovery');
let SUPABASE_CONFIG=window.FP_LOUNGE_SUPABASE||{};
let supabaseClient=SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey&&window.supabase
  ? window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey)
  : null;
function getPosts(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){return[]}}
function setPosts(posts){localStorage.setItem(STORE_KEY,JSON.stringify(posts))}
function today(){const d=new Date();return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
fileInput.addEventListener('change',async()=>{
  const file=fileInput.files[0];if(!file)return;
  const src=await readFile(file);
  const type=file.type.includes('pdf')||file.name.toLowerCase().endsWith('.pdf')?'pdf':'image';
  selected={src,type,name:file.name,file};
  preview.classList.add('show');
  preview.innerHTML=type==='image'?`<img src="${src}" alt="">`:`<div class="pdf">PDF 미리보기</div>`;
});
form.addEventListener('reset',()=>{selected=null;preview.classList.remove('show');preview.innerHTML=''});
form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!selected){toast('파일을 선택해 주세요');return}
  submitButton.disabled=true;
  submitButton.textContent='업로드 중';
  const post={
    id:'post-'+Date.now(),
    type:selected.type,
    src:selected.src,
    title:document.getElementById('title').value.trim(),
    category:document.getElementById('category').value,
    author:document.getElementById('author').value.trim()||'관리자',
    tags:document.getElementById('tags').value.split(',').map(v=>v.trim()).filter(Boolean),
    desc:document.getElementById('desc').value.trim(),
    date:today(),
    ratio:selected.type==='pdf'?'3/4':'4/5'
  };
  try{
    const ok=await savePost(post);
    if(!ok)return;
    form.reset();
    render();
    toast('자료를 게시했습니다');
  }finally{
    submitButton.disabled=false;
    submitButton.textContent='게시하기';
  }
});
async function savePost(post){
  await configureSupabase();
  if(!supabaseClient){
    toast('Supabase 공개 환경변수 설정 후 로그인해야 업로드할 수 있습니다');
    return false;
  }
  const token=getAccessToken();
  if(!token){toast('로그인이 필요합니다');return false}
  const body=new FormData();
  body.append('file',selected.file,selected.name);
  body.append('title',post.title);
  body.append('category',post.category);
  body.append('author',post.author);
  body.append('tags',JSON.stringify(post.tags));
  body.append('description',post.desc);
  body.append('ratio',post.ratio);
  const response=await fetch('/api/admin/upload',{method:'POST',headers:{Authorization:`Bearer ${token}`},body});
  const result=await response.json().catch(()=>({error:'업로드 응답을 읽을 수 없습니다.'}));
  if(!response.ok){toast(result.error||'Google Drive 업로드에 실패했습니다');return false}
  return true;
}
list.addEventListener('click',e=>{
  const btn=e.target.closest('[data-del]');if(!btn)return;
  deletePost(btn.dataset.del,btn.dataset.path);
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(supabaseClient){toast('전체 삭제는 안전을 위해 비활성화했습니다');return}
  if(!getPosts().length){toast('삭제할 자료가 없습니다');return}
  if(confirm('관리자에서 등록한 자료를 모두 삭제할까요?')){setPosts([]);render();toast('전체 삭제했습니다')}
});
async function deletePost(id,path){
  if(supabaseClient){
    const token=getAccessToken();
    if(!token){toast('로그인이 필요합니다');return}
    const response=await fetch('/api/admin/delete',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
      body:JSON.stringify({id,driveFileId:path})
    });
    const result=await response.json().catch(()=>({error:'삭제 응답을 읽을 수 없습니다.'}));
    if(!response.ok){toast(result.error||'삭제에 실패했습니다');return}
  }else{
    setPosts(getPosts().filter(p=>p.id!==id));
  }
  render();toast('자료를 삭제했습니다');
}
async function getAdminPosts(){
  await configureSupabase();
  if(supabaseClient){
    const {data,error}=await supabaseClient.from('fp_posts').select('*').order('created_at',{ascending:false});
    if(!error&&Array.isArray(data))return data.map(row=>({
      id:String(row.id),
      type:row.type,
      src:row.type==='pdf'&&row.drive_file_id?driveThumbnailUrl(row.drive_file_id):row.media_url,
      title:row.title,
      category:row.category,
      author:row.author,
      tags:row.tags||[],
      date:formatDate(row.created_at),
      storagePath:row.drive_file_id||row.storage_path||'',
      storageProvider:row.storage_provider||'local'
    }));
  }
  return getPosts();
}
function formatDate(value){
  const d=value?new Date(value):new Date();
  if(Number.isNaN(d.getTime()))return '';
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function driveThumbnailUrl(fileId){
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w600`;
}
async function render(){
  const posts=await getAdminPosts();
  renderTagSuggestions(posts);
  const q=adminSearch.value.trim().toLowerCase();
  const filtered=q?posts.filter(p=>[p.title,...(p.tags||[])].filter(Boolean).join(' ').toLowerCase().includes(q)):posts;
  if(!posts.length){list.innerHTML='<p class="empty">아직 등록한 자료가 없습니다.<br>첫 자료를 게시하면 목록에 표시됩니다.</p>';return}
  if(!filtered.length){list.innerHTML='<p class="empty">조회된 자료가 없습니다.</p>';return}
  list.innerHTML=filtered.map(p=>`<article class="item">
    <div class="item-media">${p.type==='image'||p.src?`<img src="${p.src}" alt="">`:'<div class="pdf">PDF</div>'}</div>
    <div><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.category)} · ${escapeHtml(p.date)} · ${escapeHtml(p.author)} · ${p.storageProvider==='google_drive'?'Google Drive':'Local'}</p></div>
    <button class="danger" data-del="${p.id}" data-path="${p.storagePath||''}" type="button">삭제</button>
  </article>`).join('');
}
function renderTagSuggestions(posts){
  const recent=[];
  posts.forEach(post=>(post.tags||[]).forEach(tag=>{
    const clean=String(tag).trim();
    if(clean&&!recent.includes(clean))recent.push(clean);
  }));
  tagSuggestions.innerHTML=recent.slice(0,12).map(tag=>`<button class="tag-chip" data-tag="${escapeHtml(tag)}" type="button">#${escapeHtml(tag)}</button>`).join('');
}
tagSuggestions.addEventListener('click',e=>{
  const button=e.target.closest('[data-tag]');
  if(!button)return;
  const input=document.getElementById('tags');
  const tags=input.value.split(',').map(v=>v.trim()).filter(Boolean);
  const tag=button.dataset.tag;
  if(!tags.includes(tag))tags.push(tag);
  input.value=tags.join(', ');
  input.focus();
});
adminSearch.addEventListener('input',render);
publicPasscode.addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);
});
passcodeForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const passcode=publicPasscode.value.trim();
  if(!/^\d{4}$/.test(passcode)){toast('4자리 숫자 비밀번호를 입력해 주세요');return}
  const token=getAccessToken();
  if(!token){toast('로그인이 필요합니다');return}
  savePasscodeBtn.disabled=true;
  savePasscodeBtn.textContent='저장 중';
  const response=await fetch('/api/admin/passcode',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
    body:JSON.stringify({passcode})
  });
  const result=await response.json().catch(()=>({error:'저장 응답을 읽을 수 없습니다.'}));
  savePasscodeBtn.disabled=false;
  savePasscodeBtn.textContent='저장';
  if(!response.ok){toast(result.error||'접속 비밀번호 저장에 실패했습니다');return}
  publicPasscode.value='';
  passcodeStatus.textContent='설정됨';
  toast('일반 사용자 비밀번호를 저장했습니다');
});
authForm.addEventListener('submit',async e=>{
  e.preventDefault();
  await configureSupabase();
  if(!supabaseClient){toast('Vercel에 Supabase 공개 환경변수를 넣어주세요');return}
  const button=document.getElementById('signInBtn');
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  button.disabled=true;
  button.textContent='확인 중';
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  button.disabled=false;
  button.textContent='로그인';
  if(error){toast(getAuthErrorMessage(error));return}
  toast('로그인되었습니다');
});
document.getElementById('togglePassword').addEventListener('click',()=>togglePasswordInput('authPassword','togglePassword','비밀번호'));
document.getElementById('toggleNewPassword').addEventListener('click',()=>togglePasswordInput('newPassword','toggleNewPassword','새 비밀번호'));
document.getElementById('resetPasswordBtn').addEventListener('click',async()=>{
  await configureSupabase();
  if(!supabaseClient){toast('Vercel에 Supabase 공개 환경변수를 넣어주세요');return}
  const email=document.getElementById('authEmail').value.trim();
  if(!email){toast('아이디에 이메일 주소를 먼저 입력해 주세요');return}
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin.html'});
  if(error){toast(getAuthErrorMessage(error));return}
  toast('비밀번호 재설정 메일을 보냈습니다');
});
document.getElementById('passwordResetForm').addEventListener('submit',async e=>{
  e.preventDefault();
  await configureSupabase();
  if(!supabaseClient){toast('Vercel에 Supabase 공개 환경변수를 넣어주세요');return}
  const button=document.getElementById('updatePasswordBtn');
  const password=document.getElementById('newPassword').value;
  if(password.length<6){toast('비밀번호는 6자 이상 입력해 주세요');return}
  button.disabled=true;
  button.textContent='저장 중';
  const {error}=await supabaseClient.auth.updateUser({password});
  button.disabled=false;
  button.textContent='새 비밀번호 저장';
  if(error){toast(getAuthErrorMessage(error));return}
  document.getElementById('passwordResetForm').reset();
  passwordRecoveryMode=false;
  toast('비밀번호를 변경했습니다');
  const {data}=await supabaseClient.auth.getSession();
  applySession(data.session);
});
function togglePasswordInput(inputId,buttonId,label){
  const input=document.getElementById(inputId);
  const button=document.getElementById(buttonId);
  const visible=input.type==='text';
  input.type=visible?'password':'text';
  button.setAttribute('aria-pressed',String(!visible));
  button.setAttribute('aria-label',visible?`${label} 보기`:`${label} 숨기기`);
}
signOutBtn.addEventListener('click',async()=>{
  if(supabaseClient)await supabaseClient.auth.signOut();
});
function getAccessToken(){return currentSession&&currentSession.access_token?currentSession.access_token:''}
async function loadPasscodeStatus(){
  const token=getAccessToken();
  if(!token)return;
  try{
    const response=await fetch('/api/admin/passcode',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
    const result=await response.json().catch(()=>({configured:false}));
    passcodeStatus.textContent=response.ok&&result.configured?'설정됨':'미설정';
  }catch(error){
    passcodeStatus.textContent='상태 확인 실패';
  }
}
async function initAuth(){
  await configureSupabase();
  if(!supabaseClient){authPanel.hidden=false;adminLayout.hidden=true;toast('Supabase 공개 환경변수가 필요합니다');return}
  const {data}=await supabaseClient.auth.getSession();
  applySession(data.session);
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'){showPasswordReset(session);return}
    applySession(session);
  });
}
async function configureSupabase(){
  if(supabaseClient||!window.supabase)return supabaseClient;
  if(!SUPABASE_CONFIG.url||!SUPABASE_CONFIG.publishableKey){
    try{
      const response=await fetch('/api/config',{cache:'no-store'});
      if(response.ok){
        const config=await response.json();
        SUPABASE_CONFIG={
          ...SUPABASE_CONFIG,
          url:config.supabaseUrl||SUPABASE_CONFIG.url,
          publishableKey:config.supabasePublishableKey||SUPABASE_CONFIG.publishableKey
        };
      }
    }catch(error){}
  }
  if(SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey){
    supabaseClient=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey);
  }
  return supabaseClient;
}
function applySession(session){
  currentSession=session||null;
  if(passwordRecoveryMode&&currentSession){showPasswordReset(currentSession);return}
  authForm.hidden=false;
  document.getElementById('passwordResetForm').hidden=true;
  authPanel.hidden=!!currentSession;
  adminLayout.hidden=!currentSession;
  signOutBtn.hidden=!currentSession;
  if(currentSession){render();loadPasscodeStatus()}
}
function showPasswordReset(session){
  passwordRecoveryMode=true;
  currentSession=session||currentSession;
  authPanel.hidden=false;
  authForm.hidden=true;
  document.getElementById('passwordResetForm').hidden=false;
  adminLayout.hidden=true;
  signOutBtn.hidden=true;
  setTimeout(()=>document.getElementById('newPassword').focus(),80);
}
function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getAuthErrorMessage(error){
  const message=String(error&&error.message?error.message:'').toLowerCase();
  if(message.includes('invalid login credentials'))return '아이디 또는 비밀번호를 확인해 주세요';
  if(message.includes('email not confirmed'))return '이메일 인증 후 로그인해 주세요';
  if(message.includes('rate limit'))return '요청이 많습니다. 잠시 후 다시 시도해 주세요';
  return error&&error.message?error.message:'로그인 처리에 실패했습니다';
}
let timer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('on'),1800)}
initAuth();
</script>
</body>
</html>
