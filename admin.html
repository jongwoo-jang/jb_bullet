<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전환법인 라운지 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#F3F5F7;--surface:#fff;--ink:#20242A;--ink2:#626B76;--ink3:#A4ACB5;--brand:#5BC2E7;--brand2:#003CDC;--line:#ECEFF2;--soft:#E8F8FD;--shadow:0 12px 32px rgba(24,34,45,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;letter-spacing:0}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{width:min(980px,100%);margin:0 auto;padding:22px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(145deg,var(--brand),var(--brand2));position:relative;box-shadow:0 8px 18px rgba(0,60,220,.18)}
.mark::after{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.75);border-radius:5px}
.top h1{font-size:20px;margin:0;font-weight:850}
.top a{margin-left:auto;height:38px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink2)}
.account{height:38px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;background:#20242A;color:#fff;font-size:12px;font-weight:850}
.account[hidden]{display:none}
.layout{display:grid;grid-template-columns:minmax(0,390px) 1fr;gap:16px;align-items:start}
.layout[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.auth-panel{width:min(420px,100%);margin:72px auto 0;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.auth-panel[hidden]{display:none}
.auth-panel h2{margin:0 0 8px;font-size:22px;line-height:1.25}
.auth-panel p{margin:0 0 18px;color:var(--ink2);font-size:13px;line-height:1.55}
.auth-actions{display:flex;gap:8px;margin-top:16px}
.form{padding:16px}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:850;color:var(--ink2)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;background:#FBFCFD;color:var(--ink);padding:12px;outline:none}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.drop{border:1px dashed #C9D2DB;border-radius:8px;background:#FBFCFD;padding:18px;text-align:center;color:var(--ink2)}
.drop input{display:none}
.drop b{display:block;font-size:14px;color:var(--ink);margin-bottom:5px}
.preview{margin-top:12px;border-radius:8px;overflow:hidden;background:#EEF2F5;border:1px solid var(--line);display:none}
.preview.show{display:block}
.preview img{display:block;width:100%;max-height:360px;object-fit:contain;background:#111}
.preview .pdf{aspect-ratio:4/3;display:grid;place-items:center;font-weight:850;color:var(--brand2);background:var(--soft)}
.actions{display:flex;gap:8px;margin-top:16px}
.primary,.ghost,.danger{height:44px;border-radius:8px;font-weight:850}
.primary{flex:1;background:var(--brand2);color:#fff;box-shadow:0 10px 22px rgba(0,60,220,.2)}
.primary:disabled{opacity:.58;cursor:progress;box-shadow:none}
.ghost{padding:0 14px;background:#F4F6F8;color:var(--ink2)}
.danger{padding:0 12px;background:#EDF6FF;color:var(--brand2)}
.hint{margin:9px 0 0;color:var(--ink3);font-size:11.5px;line-height:1.5}
.list{padding:10px}
.list-head{display:flex;align-items:center;padding:5px 6px 12px}
.list-head b{font-size:14px}
.list-head button{margin-left:auto;background:#F4F6F8;color:var(--ink2);height:34px;border-radius:8px;padding:0 10px;font-size:12px;font-weight:800}
.admin-search{padding:0 6px 10px}
.admin-search label{display:flex;align-items:center;gap:8px;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:#FBFCFD;color:var(--ink2)}
.admin-search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}
.admin-search input::placeholder{color:var(--ink3)}
.item{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
.item-media{width:74px;height:88px;border-radius:8px;overflow:hidden;background:#EEF2F5}
.item-media img{width:100%;height:100%;object-fit:cover}
.item-media .pdf{width:100%;height:100%;display:grid;place-items:center;background:var(--soft);color:var(--brand2);font-size:12px;font-weight:900}
.item h3{font-size:13px;line-height:1.35;margin:0 0 5px;font-weight:820}
.item p{margin:0;color:var(--ink2);font-size:11px;font-weight:650}
.empty{padding:48px 10px;text-align:center;color:var(--ink3);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;background:rgba(32,36,42,.96);color:#fff;border-radius:8px;padding:12px 16px;font-size:13px;font-weight:760;transition:.24s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.layout{grid-template-columns:1fr}.top{position:sticky;top:0;z-index:5;background:rgba(238,243,247,.88);backdrop-filter:blur(14px);padding:12px 0;margin-top:-12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="mark"></span>
    <h1>자료 관리자</h1>
    <button class="account" id="signOutBtn" type="button" hidden>로그아웃</button>
    <a href="index.html">피드 보기</a>
  </header>

  <section class="auth-panel" id="authPanel">
    <h2>관리자 로그인</h2>
    <p>관리자 권한이 있는 이메일 계정으로 로그인하면 사진과 PDF를 Google Drive에 업로드할 수 있습니다.</p>
    <form id="authForm">
      <div class="field"><label for="authEmail">이메일</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="authPassword">비밀번호</label><input id="authPassword" type="password" autocomplete="current-password" required minlength="6"></div>
      <div class="auth-actions"><button class="primary" id="signInBtn" type="submit">로그인</button><button class="ghost" id="signUpBtn" type="button">가입</button></div>
      <p class="hint">가입 후 이메일 확인이 필요할 수 있으며, 관리자 이메일 목록에 등록된 계정만 업로드할 수 있습니다.</p>
    </form>
  </section>

  <div class="layout" id="adminLayout" hidden>
    <section class="panel form">
      <form id="postForm">
        <div class="field">
          <label for="file">사진 또는 PDF</label>
          <label class="drop" for="file">
            <b>파일 선택</b>
            <span>JPG, PNG, WebP, PDF를 등록할 수 있습니다.</span>
            <input id="file" type="file" accept="image/*,.pdf,application/pdf" required>
          </label>
          <div class="preview" id="preview"></div>
        </div>
        <div class="field"><label for="title">제목</label><input id="title" required placeholder="예: 8월 신상품 핵심 이미지"></div>
        <div class="field"><label for="category">분류</label><select id="category"><option>상품</option><option>시상</option></select></div>
        <div class="field"><label for="author">작성 부서</label><input id="author" value="관리자"></div>
        <div class="field"><label for="tags">태그</label><input id="tags" placeholder="상품, 교육, 시상"></div>
        <div class="field"><label for="desc">설명</label><textarea id="desc" placeholder="피드 상세 화면에 표시할 짧은 설명"></textarea></div>
        <div class="actions"><button class="primary" type="submit">게시하기</button><button class="ghost" type="reset">초기화</button></div>
      </form>
    </section>

    <section class="panel list">
      <div class="list-head"><b>등록한 자료</b><button id="clearBtn" type="button">전체 삭제</button></div>
      <div class="admin-search">
        <label for="adminSearch">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="adminSearch" type="search" placeholder="제목 또는 태그로 조회">
        </label>
      </div>
      <div id="postList"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-config.js"></script>
<script>
const STORE_KEY='fpLoungePosts';
const form=document.getElementById('postForm');
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const list=document.getElementById('postList');
const adminSearch=document.getElementById('adminSearch');
const authPanel=document.getElementById('authPanel');
const authForm=document.getElementById('authForm');
const signUpBtn=document.getElementById('signUpBtn');
const signOutBtn=document.getElementById('signOutBtn');
const adminLayout=document.getElementById('adminLayout');
const submitButton=form.querySelector('button[type="submit"]');
let selected=null;
let currentSession=null;
let SUPABASE_CONFIG=window.FP_LOUNGE_SUPABASE||{};
let supabaseClient=SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey&&window.supabase
  ? window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey)
  : null;
function getPosts(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){return[]}}
function setPosts(posts){localStorage.setItem(STORE_KEY,JSON.stringify(posts))}
function today(){const d=new Date();return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
fileInput.addEventListener('change',async()=>{
  const file=fileInput.files[0];if(!file)return;
  const src=await readFile(file);
  const type=file.type.includes('pdf')||file.name.toLowerCase().endsWith('.pdf')?'pdf':'image';
  selected={src,type,name:file.name,file};
  preview.classList.add('show');
  preview.innerHTML=type==='image'?`<img src="${src}" alt="">`:`<div class="pdf">PDF 미리보기</div>`;
});
form.addEventListener('reset',()=>{selected=null;preview.classList.remove('show');preview.innerHTML=''});
form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!selected){toast('파일을 선택해 주세요');return}
  submitButton.disabled=true;
  submitButton.textContent='업로드 중';
  const post={
    id:'post-'+Date.now(),
    type:selected.type,
    src:selected.src,
    title:document.getElementById('title').value.trim(),
    category:document.getElementById('category').value,
    author:document.getElementById('author').value.trim()||'관리자',
    tags:document.getElementById('tags').value.split(',').map(v=>v.trim()).filter(Boolean),
    desc:document.getElementById('desc').value.trim(),
    date:today(),
    ratio:selected.type==='pdf'?'3/4':'4/5'
  };
  try{
    const ok=await savePost(post);
    if(!ok)return;
    form.reset();
    render();
    toast('자료를 게시했습니다');
  }finally{
    submitButton.disabled=false;
    submitButton.textContent='게시하기';
  }
});
async function savePost(post){
  await configureSupabase();
  if(!supabaseClient){
    toast('Supabase 공개 환경변수 설정 후 로그인해야 업로드할 수 있습니다');
    return false;
  }
  const token=getAccessToken();
  if(!token){toast('로그인이 필요합니다');return false}
  const body=new FormData();
  body.append('file',selected.file,selected.name);
  body.append('title',post.title);
  body.append('category',post.category);
  body.append('author',post.author);
  body.append('tags',JSON.stringify(post.tags));
  body.append('description',post.desc);
  body.append('ratio',post.ratio);
  const response=await fetch('/api/admin/upload',{method:'POST',headers:{Authorization:`Bearer ${token}`},body});
  const result=await response.json().catch(()=>({error:'업로드 응답을 읽을 수 없습니다.'}));
  if(!response.ok){toast(result.error||'Google Drive 업로드에 실패했습니다');return false}
  return true;
}
list.addEventListener('click',e=>{
  const btn=e.target.closest('[data-del]');if(!btn)return;
  deletePost(btn.dataset.del,btn.dataset.path);
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(supabaseClient){toast('전체 삭제는 안전을 위해 비활성화했습니다');return}
  if(!getPosts().length){toast('삭제할 자료가 없습니다');return}
  if(confirm('관리자에서 등록한 자료를 모두 삭제할까요?')){setPosts([]);render();toast('전체 삭제했습니다')}
});
async function deletePost(id,path){
  if(supabaseClient){
    const token=getAccessToken();
    if(!token){toast('로그인이 필요합니다');return}
    const response=await fetch('/api/admin/delete',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
      body:JSON.stringify({id,driveFileId:path})
    });
    const result=await response.json().catch(()=>({error:'삭제 응답을 읽을 수 없습니다.'}));
    if(!response.ok){toast(result.error||'삭제에 실패했습니다');return}
  }else{
    setPosts(getPosts().filter(p=>p.id!==id));
  }
  render();toast('자료를 삭제했습니다');
}
async function getAdminPosts(){
  await configureSupabase();
  if(supabaseClient){
    const {data,error}=await supabaseClient.from('fp_posts').select('*').order('created_at',{ascending:false});
    if(!error&&Array.isArray(data))return data.map(row=>({
      id:String(row.id),
      type:row.type,
      src:row.media_url,
      title:row.title,
      category:row.category,
      author:row.author,
      tags:row.tags||[],
      date:formatDate(row.created_at),
      storagePath:row.drive_file_id||row.storage_path||'',
      storageProvider:row.storage_provider||'local'
    }));
  }
  return getPosts();
}
function formatDate(value){
  const d=value?new Date(value):new Date();
  if(Number.isNaN(d.getTime()))return '';
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
async function render(){
  const posts=await getAdminPosts();
  const q=adminSearch.value.trim().toLowerCase();
  const filtered=q?posts.filter(p=>[p.title,...(p.tags||[])].filter(Boolean).join(' ').toLowerCase().includes(q)):posts;
  if(!posts.length){list.innerHTML='<p class="empty">아직 등록한 자료가 없습니다.</p>';return}
  if(!filtered.length){list.innerHTML='<p class="empty">조회된 자료가 없습니다.</p>';return}
  list.innerHTML=filtered.map(p=>`<article class="item">
    <div class="item-media">${p.type==='image'?`<img src="${p.src}" alt="">`:'<div class="pdf">PDF</div>'}</div>
    <div><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.category)} · ${escapeHtml(p.date)} · ${escapeHtml(p.author)} · ${p.storageProvider==='google_drive'?'Google Drive':'Local'}</p></div>
    <button class="danger" data-del="${p.id}" data-path="${p.storagePath||''}" type="button">삭제</button>
  </article>`).join('');
}
adminSearch.addEventListener('input',render);
authForm.addEventListener('submit',async e=>{
  e.preventDefault();
  await configureSupabase();
  if(!supabaseClient){toast('Vercel에 Supabase 공개 환경변수를 넣어주세요');return}
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){toast(error.message||'로그인에 실패했습니다');return}
  toast('로그인했습니다');
});
signUpBtn.addEventListener('click',async()=>{
  await configureSupabase();
  if(!supabaseClient){toast('Vercel에 Supabase 공개 환경변수를 넣어주세요');return}
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  if(!email||password.length<6){toast('이메일과 6자 이상 비밀번호를 입력해 주세요');return}
  const {error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/admin.html'}});
  if(error){toast(error.message||'가입에 실패했습니다');return}
  toast('가입 메일을 확인해 주세요');
});
signOutBtn.addEventListener('click',async()=>{
  if(supabaseClient)await supabaseClient.auth.signOut();
});
function getAccessToken(){return currentSession&&currentSession.access_token?currentSession.access_token:''}
async function initAuth(){
  await configureSupabase();
  if(!supabaseClient){authPanel.hidden=false;adminLayout.hidden=true;toast('Supabase 공개 환경변수가 필요합니다');return}
  const {data}=await supabaseClient.auth.getSession();
  applySession(data.session);
  supabaseClient.auth.onAuthStateChange((event,session)=>applySession(session));
}
async function configureSupabase(){
  if(supabaseClient||!window.supabase)return supabaseClient;
  if(!SUPABASE_CONFIG.url||!SUPABASE_CONFIG.publishableKey){
    try{
      const response=await fetch('/api/config',{cache:'no-store'});
      if(response.ok){
        const config=await response.json();
        SUPABASE_CONFIG={
          ...SUPABASE_CONFIG,
          url:config.supabaseUrl||SUPABASE_CONFIG.url,
          publishableKey:config.supabasePublishableKey||SUPABASE_CONFIG.publishableKey
        };
      }
    }catch(error){}
  }
  if(SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey){
    supabaseClient=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey);
  }
  return supabaseClient;
}
function applySession(session){
  currentSession=session||null;
  authPanel.hidden=!!currentSession;
  adminLayout.hidden=!currentSession;
  signOutBtn.hidden=!currentSession;
  if(currentSession)render();
}
function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let timer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('on'),1800)}
initAuth();
</script>
</body>
</html>
