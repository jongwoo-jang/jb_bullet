<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실적 JSON 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#F3F5F7;--surface:#fff;--ink:#20242A;--ink2:#626B76;--ink3:#A4ACB5;
  --brand:#003CDC;--brand-soft:#E8F8FD;--line:#ECEFF2;--danger:#D94343;
  --shadow:0 12px 34px rgba(24,34,45,.09);--ease:cubic-bezier(.22,.8,.28,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;letter-spacing:0;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{width:min(780px,100%);margin:0 auto;padding:22px 14px 48px}
.top{margin-bottom:16px}
.top span{display:block;margin-bottom:6px;color:var(--brand);font-size:12px;font-weight:900}
.top h1{margin:0;font-size:26px;line-height:1.15;font-weight:900}
.tabs{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;padding:6px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.tab{min-height:50px;border-radius:10px;color:var(--ink2);font-size:15px;font-weight:900}
.tab[aria-selected="true"]{background:var(--brand);color:#fff}
.panel{display:none;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:14px}
.field label,.group-label{display:block;margin-bottom:8px;color:var(--ink2);font-size:13px;font-weight:850}
.field input,.field textarea,.field select{
  width:100%;min-height:52px;border:1px solid var(--line);border-radius:11px;background:#FBFCFD;color:var(--ink);
  padding:13px 14px;font-size:15px;outline:none;transition:border-color .16s,box-shadow .16s,background .16s;
}
.field textarea{min-height:300px;line-height:1.5;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,60,220,.08)}
.condition-tools{display:grid;grid-template-columns:1fr 1.45fr;gap:12px;margin-bottom:14px}
.saved-panel{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#FBFCFD}
.saved-panel .field{margin:0}
.saved-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saved-status{min-height:20px;margin:0;color:var(--ink2);font-size:12.5px;font-weight:800;line-height:1.45}
.condition-list{display:grid;gap:12px}
.condition-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.condition-index{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:900}
.card-head strong{margin-right:auto;font-size:15px;font-weight:900}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 11px;border-radius:10px;background:#F4F6F8;color:var(--ink2);font-size:12.5px;font-weight:900}
.icon-btn:disabled{opacity:.45;cursor:not-allowed}
.check-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.check{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#FBFCFD;font-size:14px;font-weight:850;color:var(--ink2)}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.tier-list{display:grid;gap:8px;margin-bottom:12px}
.tier-row{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FBFCFD}
.tier-row .field{margin:0}
.add-row{margin-top:12px}
.add-row .ghost{width:100%}
.actions{position:sticky;bottom:0;display:flex;gap:8px;margin-top:14px;padding-top:12px;background:linear-gradient(180deg,rgba(243,245,247,0),var(--bg) 38%)}
.primary,.ghost{min-height:54px;border-radius:12px;font-weight:900}
.primary{flex:1;background:var(--brand);color:#fff;box-shadow:0 12px 24px rgba(0,60,220,.18)}
.ghost{padding:0 16px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.summary{margin-top:12px;padding:13px 14px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:850;line-height:1.5}
.error{background:#FFF1F1;color:var(--danger)}
@media(max-width:640px){
  .wrap{padding:16px 10px 36px}
  .top h1{font-size:24px}
  .grid,.tier-row,.condition-tools{grid-template-columns:1fr}
  .check-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .condition-card{padding:12px}
  .tier-row .icon-btn{width:100%}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <span>전환법인 라운지</span>
    <h1>실적 JSON 생성기</h1>
  </header>
  <nav class="tabs" aria-label="실적 JSON 생성 단계">
    <button class="tab" type="button" data-tab="condition" aria-selected="true">시상조건</button>
    <button class="tab" type="button" data-tab="data" aria-selected="false">실적데이터 입력</button>
  </nav>

  <section class="panel active" data-panel="condition">
    <div class="field"><label for="month">대상월</label><input id="month" type="month" required></div>
    <div class="condition-tools" aria-label="저장된 시상조건 관리">
      <div>
        <div class="field"><label for="savedAwardName">저장 이름</label><input id="savedAwardName" placeholder="예: 9월 인보험 시상"></div>
        <button class="primary" id="saveConditionSetBtn" type="button">시상조건 저장</button>
      </div>
      <div class="saved-panel">
        <div class="field"><label for="savedAwardSelect">저장된 시상</label><select id="savedAwardSelect"><option value="">저장된 시상 없음</option></select></div>
        <div class="saved-actions">
          <button class="ghost" id="loadConditionSetBtn" type="button">불러오기</button>
          <button class="ghost" id="deleteConditionSetBtn" type="button">삭제</button>
        </div>
        <p class="saved-status" id="savedAwardStatus">시상조건을 저장하면 이 브라우저에서 다시 불러올 수 있습니다.</p>
      </div>
    </div>
    <div class="condition-list" id="conditionList"></div>
    <div class="add-row"><button class="ghost" id="addConditionBtn" type="button">시상조건 추가</button></div>
    <div class="summary">시상조건은 여러 개를 한 JSON에 함께 저장합니다. 각 조건마다 기간, 장기세분, 실손 제외, 법인단체 제외, 구간별 시상금액과 시상물품을 다르게 설정할 수 있습니다.</div>
  </section>

  <section class="panel" data-panel="data">
    <div class="field">
      <label for="rawData">실적데이터 붙여넣기</label>
      <textarea id="rawData" placeholder="엑셀에서 헤더 행과 데이터 행을 함께 복사해 붙여넣기"></textarea>
    </div>
    <div class="summary" id="parseSummary">실적데이터를 붙여넣으면 저장 시 자동으로 JSON 구조로 변환됩니다.</div>
  </section>

  <div class="actions">
    <button class="primary" id="downloadBtn" type="button">JSON 파일로 저장하기</button>
    <button class="ghost" id="resetBtn" type="button">초기화</button>
  </div>
</main>

<script>
const HEADERS={
  region:'지역단명',
  branch:'지점명',
  contractClosedAt:'계약마감시간',
  longTermType:'장기마케팅세분',
  agencyName:'성명_대리점',
  userCode:'사용인코드',
  userName:'사용인명',
  monthlyPremium:'월환산보험료',
  paymentCount:'납입건수',
  actualLossType:'실손구분',
  corporateGroupType:'법인단체',
  selfType:'본인여부'
};
const ACTUAL_LOSS_KEYWORDS=['전환표준','유병노후'];
const CORPORATE_GROUP_KEYWORD='법인단체';
const MAX_CONDITIONS=20;
const MAX_TIERS=20;
const MAX_SAVED_AWARDS=50;
const AWARD_TEMPLATE_STORE_KEY='fpPerformanceAwardTemplates';
const THOUSAND_UNIT=1000;
const conditionList=document.getElementById('conditionList');
const parseSummary=document.getElementById('parseSummary');
const savedAwardName=document.getElementById('savedAwardName');
const savedAwardSelect=document.getElementById('savedAwardSelect');
const savedAwardStatus=document.getElementById('savedAwardStatus');
let conditionSeq=0;
let tierSeq=0;
let loadedAwardTemplateId='';

document.getElementById('month').value=new Date().toISOString().slice(0,7);
addCondition();
renderSavedAwardOptions();

document.querySelectorAll('[data-tab]').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('[data-tab]').forEach(item=>item.setAttribute('aria-selected',String(item===tab)));
    document.querySelectorAll('[data-panel]').forEach(panel=>panel.classList.toggle('active',panel.dataset.panel===tab.dataset.tab));
  });
});
document.getElementById('addConditionBtn').addEventListener('click',()=>addCondition());
document.getElementById('saveConditionSetBtn').addEventListener('click',saveCurrentAwardTemplate);
document.getElementById('loadConditionSetBtn').addEventListener('click',()=>loadAwardTemplate(savedAwardSelect.value));
document.getElementById('deleteConditionSetBtn').addEventListener('click',()=>deleteAwardTemplate(savedAwardSelect.value));
savedAwardSelect.addEventListener('change',()=>{
  const item=getAwardTemplates().find(template=>template.id===savedAwardSelect.value);
  savedAwardName.value=item?item.name:'';
  if(item&&item.id!==loadedAwardTemplateId){
    savedAwardStatus.textContent=`'${item.name}' 시상조건을 불러오려면 불러오기를 눌러 주세요.`;
  }
});
conditionList.addEventListener('click',event=>{
  const removeCondition=event.target.closest('[data-remove-condition]');
  if(removeCondition){
    removeCondition.closest('.condition-card').remove();
    renumberConditions();
    return;
  }
  const addTierButton=event.target.closest('[data-add-tier]');
  if(addTierButton){
    addTier(addTierButton.closest('.condition-card'));
    return;
  }
  const removeTier=event.target.closest('[data-remove-tier]');
  if(removeTier){
    const card=removeTier.closest('.condition-card');
    removeTier.closest('.tier-row').remove();
    renumberTiers(card);
  }
});
document.getElementById('rawData').addEventListener('input',()=>{
  const rows=parsePerformanceRows(document.getElementById('rawData').value);
  parseSummary.textContent=rows.length?`${rows.length.toLocaleString()}건을 인식했습니다.`:'실적데이터를 인식하지 못했습니다.';
  parseSummary.classList.toggle('error',!rows.length&&document.getElementById('rawData').value.trim());
});
document.getElementById('downloadBtn').addEventListener('click',()=>{
  const dataset=buildDataset();
  if(!dataset)return;
  const blob=new Blob([JSON.stringify(dataset,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`performance-${dataset.month}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
document.getElementById('resetBtn').addEventListener('click',()=>location.reload());

function addCondition(values={}){
  const count=conditionList.querySelectorAll('.condition-card').length;
  if(count>=MAX_CONDITIONS){alert(`시상조건은 최대 ${MAX_CONDITIONS}개까지 추가할 수 있습니다.`);return}
  const id=++conditionSeq;
  const card=document.createElement('article');
  card.className='condition-card';
  card.dataset.conditionId=String(id);
  card.innerHTML=`
    <div class="card-head">
      <span class="condition-index"></span>
      <strong>시상조건</strong>
      <button class="icon-btn" data-remove-condition type="button">삭제</button>
    </div>
    <div class="field"><label for="awardName${id}">시상이름</label><input id="awardName${id}" data-field="name" placeholder="9월 인보험 시상" required></div>
    <div class="grid">
      <div class="field"><label for="awardStartDate${id}">시작일</label><input id="awardStartDate${id}" data-field="awardStartDate" type="date"></div>
      <div class="field"><label for="awardEndDate${id}">종료일</label><input id="awardEndDate${id}" data-field="awardEndDate" type="date"></div>
    </div>
    <div class="field"><label for="conditionType${id}">달성조건</label><select id="conditionType${id}" data-field="conditionType"><option value="premiumSum">월납환산합산금액</option><option value="paymentCount">납입건수</option></select></div>
    <span class="group-label">달성 구간</span>
    <div class="tier-list" data-field="tiers"></div>
    <button class="icon-btn" data-add-tier type="button">구간 추가</button>
    <span class="group-label" style="margin-top:14px">장기세분</span>
    <div class="check-grid" data-field="longTermTypes">
      ${['A01','A02','A03','A04','A05'].map(code=>`<label class="check"><input type="checkbox" value="${code}" checked>${code}</label>`).join('')}
    </div>
    <label class="check"><input data-field="excludeActualLoss" type="checkbox" checked>실손 제외</label>
    <label class="check"><input data-field="excludeCorporateGroup" type="checkbox">법인단체 제외</label>
  `;
  conditionList.appendChild(card);
  const tiers=Array.isArray(values.tiers)&&values.tiers.length?values.tiers:[values];
  tiers.forEach(tier=>addTier(card,tier));
  setConditionValues(card,values);
  renumberConditions();
}
function addTier(card,values={}){
  const tierList=card.querySelector('[data-field="tiers"]');
  const count=tierList.querySelectorAll('.tier-row').length;
  if(count>=MAX_TIERS){alert(`구간은 조건별 최대 ${MAX_TIERS}개까지 추가할 수 있습니다.`);return}
  const id=++tierSeq;
  const row=document.createElement('div');
  row.className='tier-row';
  row.innerHTML=`
    <div class="field"><label for="tierTarget${id}">달성 기준값(천원)</label><input id="tierTarget${id}" data-tier-field="targetValue" inputmode="numeric" placeholder="300" required></div>
    <div class="field"><label for="tierAmount${id}">시상금액(천원)</label><input id="tierAmount${id}" data-tier-field="awardAmount" inputmode="numeric" placeholder="50"></div>
    <div class="field"><label for="tierItem${id}">시상물품</label><input id="tierItem${id}" data-tier-field="awardItem" placeholder="상품권, 여행권 등"></div>
    <button class="icon-btn" data-remove-tier type="button">삭제</button>
  `;
  tierList.appendChild(row);
  row.querySelector('[data-tier-field="targetValue"]').value=toThousandInput(values.targetValue);
  row.querySelector('[data-tier-field="awardAmount"]').value=toThousandInput(values.awardAmount);
  row.querySelector('[data-tier-field="awardItem"]').value=values.awardItem||'';
  renumberTiers(card);
}
function setConditionValues(card,values){
  if(!values||!Object.keys(values).length)return;
  const set=(field,value)=>{
    const input=card.querySelector(`[data-field="${field}"]`);
    if(input&&value!==undefined&&value!==null)input.value=value;
  };
  set('name',values.name);
  set('awardStartDate',values.awardStartDate||values.startDate);
  set('awardEndDate',values.awardEndDate||values.endDate||values.awardDate);
  set('conditionType',values.conditionType);
  const exclude=card.querySelector('[data-field="excludeActualLoss"]');
  if(exclude)exclude.checked=values.excludeActualLoss!==false;
  const excludeCorporate=card.querySelector('[data-field="excludeCorporateGroup"]');
  if(excludeCorporate)excludeCorporate.checked=Boolean(values.excludeCorporateGroup||values.exclude_corporate_group);
  const selected=new Set(Array.isArray(values.longTermTypes)?values.longTermTypes:['A01','A02','A03','A04','A05']);
  card.querySelectorAll('[data-field="longTermTypes"] input').forEach(input=>{input.checked=selected.has(input.value)});
}
function renumberConditions(){
  const cards=[...conditionList.querySelectorAll('.condition-card')];
  cards.forEach((card,index)=>{
    card.querySelector('.condition-index').textContent=String(index+1);
    const remove=card.querySelector('[data-remove-condition]');
    remove.disabled=cards.length<=1;
    renumberTiers(card);
  });
}
function renumberTiers(card){
  const rows=[...card.querySelectorAll('.tier-row')];
  rows.forEach((row,index)=>{
    const remove=row.querySelector('[data-remove-tier]');
    remove.disabled=rows.length<=1;
    row.querySelector('[data-tier-field="targetValue"]').previousElementSibling.textContent=`${index+1}구간 기준값(천원)`;
  });
}
function getAwardTemplates(){
  try{
    const parsed=JSON.parse(localStorage.getItem(AWARD_TEMPLATE_STORE_KEY)||'[]');
    return Array.isArray(parsed)?parsed:[];
  }catch(error){
    return [];
  }
}
function setAwardTemplates(items){
  localStorage.setItem(AWARD_TEMPLATE_STORE_KEY,JSON.stringify(items.slice(0,MAX_SAVED_AWARDS)));
}
function renderSavedAwardOptions(){
  const items=getAwardTemplates();
  savedAwardSelect.innerHTML=items.length?'<option value="">저장된 시상 선택</option>':'<option value="">저장된 시상 없음</option>';
  items.forEach(item=>{
    const option=document.createElement('option');
    option.value=item.id;
    option.textContent=item.name;
    savedAwardSelect.appendChild(option);
  });
  savedAwardSelect.value=items.some(item=>item.id===loadedAwardTemplateId)?loadedAwardTemplateId:'';
}
function saveCurrentAwardTemplate(){
  const awardConditions=readAwardConditions({strict:false});
  if(!awardConditions)return;
  const month=document.getElementById('month').value||new Date().toISOString().slice(0,7);
  const fallbackName=awardConditions[0]?.name||`${month} 시상조건`;
  const name=savedAwardName.value.trim()||fallbackName;
  const items=getAwardTemplates();
  const id=loadedAwardTemplateId||`award-${Date.now()}`;
  const existingIndex=items.findIndex(item=>item.id===id);
  const template={id,name,month,awardConditions,updatedAt:new Date().toISOString()};
  if(existingIndex>=0){
    items[existingIndex]=template;
  }else{
    items.unshift(template);
  }
  loadedAwardTemplateId=id;
  savedAwardName.value=name;
  setAwardTemplates(items);
  renderSavedAwardOptions();
  savedAwardSelect.value=id;
  const tierCount=awardConditions.reduce((sum,condition)=>sum+(condition.tiers?.length||0),0);
  savedAwardStatus.textContent=`'${name}'에 시상조건 ${awardConditions.length}개, 구간 ${tierCount}개를 저장했습니다.`;
}
function loadAwardTemplate(id){
  const item=getAwardTemplates().find(template=>template.id===id);
  if(!item){
    savedAwardStatus.textContent='불러올 시상조건을 선택해 주세요.';
    return;
  }
  conditionList.innerHTML='';
  conditionSeq=0;
  tierSeq=0;
  loadedAwardTemplateId=item.id;
  savedAwardName.value=item.name;
  savedAwardSelect.value=item.id;
  if(item.month)document.getElementById('month').value=item.month;
  const conditions=Array.isArray(item.awardConditions)&&item.awardConditions.length?item.awardConditions:[{}];
  conditions.forEach(condition=>addCondition(condition));
  savedAwardStatus.textContent=`'${item.name}' 시상조건을 불러왔습니다. 수정 후 다시 저장할 수 있습니다.`;
}
function deleteAwardTemplate(id){
  const item=getAwardTemplates().find(template=>template.id===id);
  if(!item){
    savedAwardStatus.textContent='삭제할 시상조건을 선택해 주세요.';
    return;
  }
  if(!confirm(`'${item.name}' 시상조건을 삭제할까요?`))return;
  const items=getAwardTemplates().filter(template=>template.id!==id);
  setAwardTemplates(items);
  loadedAwardTemplateId='';
  savedAwardName.value='';
  renderSavedAwardOptions();
  savedAwardStatus.textContent=`'${item.name}' 시상조건을 삭제했습니다.`;
}
function buildDataset(){
  const rows=parsePerformanceRows(document.getElementById('rawData').value);
  const awardConditions=readAwardConditions({strict:true});
  if(!awardConditions)return null;
  if(!rows.length){alert('실적데이터를 붙여넣어 주세요.');return null}
  const month=document.getElementById('month').value||new Date().toISOString().slice(0,7);
  return {
    schemaVersion:'fp-performance-v2',
    createdAt:new Date().toISOString(),
    month,
    title:`${month} 인보험 실적`,
    awardConditions,
    performanceRows:rows
  };
}
function readAwardConditions({strict=true}={}){
  const cards=[...conditionList.querySelectorAll('.condition-card')];
  const conditions=[];
  for(const [index,card] of cards.entries()){
    const name=card.querySelector('[data-field="name"]').value.trim();
    const longTermTypes=[...card.querySelectorAll('[data-field="longTermTypes"] input:checked')].map(input=>input.value);
    const tiers=readTiers(card,{strict});
    const label=`${index+1}번 시상조건`;
    if(strict&&!name){alert(`${label}의 시상이름을 입력해 주세요.`);return null}
    if(!tiers)return null;
    if(strict&&!longTermTypes.length){alert(`${label}의 장기세분을 1개 이상 선택해 주세요.`);return null}
    const excludeActualLoss=card.querySelector('[data-field="excludeActualLoss"]').checked;
    const excludeCorporateGroup=card.querySelector('[data-field="excludeCorporateGroup"]').checked;
    conditions.push({
      name:name||`${index+1}번 시상조건`,
      conditionType:card.querySelector('[data-field="conditionType"]').value,
      awardStartDate:card.querySelector('[data-field="awardStartDate"]').value,
      awardEndDate:card.querySelector('[data-field="awardEndDate"]').value,
      targetValue:tiers[0].targetValue,
      awardAmount:tiers[0].awardAmount,
      awardItem:tiers[0].awardItem,
      tiers,
      longTermTypes,
      excludeActualLoss,
      actualLossKeywords:excludeActualLoss?ACTUAL_LOSS_KEYWORDS:[],
      excludeCorporateGroup,
      corporateGroupKeyword:excludeCorporateGroup?CORPORATE_GROUP_KEYWORD:''
    });
  }
  return conditions;
}
function readTiers(card,{strict=true}={}){
  const rows=[...card.querySelectorAll('.tier-row')];
  const tiers=[];
  for(const [index,row] of rows.entries()){
    const targetValue=fromThousandInput(row.querySelector('[data-tier-field="targetValue"]').value);
    const awardAmount=fromThousandInput(row.querySelector('[data-tier-field="awardAmount"]').value);
    const awardItem=row.querySelector('[data-tier-field="awardItem"]').value.trim();
    const label=`${card.querySelector('.condition-index').textContent}번 시상조건 ${index+1}구간`;
    if(strict&&targetValue<=0){alert(`${label}의 달성 기준값을 입력해 주세요.`);return null}
    if(strict&&awardAmount<=0&&!awardItem){alert(`${label}에는 시상금액 또는 시상물품 중 하나가 필요합니다.`);return null}
    tiers.push({targetValue,awardAmount,awardItem,unit:'KRW'});
  }
  return tiers.sort((a,b)=>a.targetValue-b.targetValue);
}
function parsePerformanceRows(text){
  const table=parseDelimited(text);
  if(table.length<2)return [];
  const headers=table[0].map(value=>String(value||'').trim());
  return table.slice(1).map(row=>{
    const item={};
    Object.entries(HEADERS).forEach(([key,label])=>{
      const index=headers.indexOf(label);
      item[key]=index>=0?String(row[index]||'').trim():'';
    });
    item.userCode=item.userCode.replace(/\s+/g,'');
    item.longTermType=item.longTermType.toUpperCase().replace(/^AO/,'A0');
    item.monthlyPremium=toNumber(item.monthlyPremium);
    item.paymentCount=toNumber(item.paymentCount);
    item.isActualLoss=ACTUAL_LOSS_KEYWORDS.some(keyword=>item.actualLossType.includes(keyword));
    item.isCorporateGroup=item.corporateGroupType.includes(CORPORATE_GROUP_KEYWORD);
    return item;
  }).filter(row=>row.userCode);
}
function parseDelimited(text){
  const clean=String(text||'').trim();
  if(!clean)return [];
  const delimiter=detectDelimiter(clean);
  return clean.split(/\r?\n/).map(line=>line.split(delimiter).map(value=>value.trim())).filter(row=>row.some(Boolean));
}
function detectDelimiter(text){
  const sample=text.split(/\r?\n/).slice(0,5).join('\n');
  const counts=[['\t',(sample.match(/\t/g)||[]).length],[',',(sample.match(/,/g)||[]).length],[';',(sample.match(/;/g)||[]).length]];
  counts.sort((a,b)=>b[1]-a[1]);
  return counts[0][1]>0?counts[0][0]:'\t';
}
function toNumber(value){
  const number=Number(String(value||'').replace(/,/g,'').replace(/[^\d.-]/g,''));
  return Number.isFinite(number)?number:0;
}
function fromThousandInput(value){
  return Math.round(toNumber(value)*THOUSAND_UNIT);
}
function toThousandInput(value){
  const number=toNumber(value);
  return number>0?String(Math.round(number/THOUSAND_UNIT)):'';
}
